<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Calypso & Magenta Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="doubleCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Rect -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Outer Neon Border Glow -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#67e8f9" stroke-width="6" stroke-opacity="0.5" />

  <!-- Main Graphic Group -->
  <g filter="url(#shadow)">
    <!-- Letter "R" (White Bold Geometry) -->
    <path d="M 120 100 H 280 C 350 100, 390 145, 390 205 C 390 265, 345 305, 275 305 H 200 V 412 H 120 V 100 Z M 200 170 V 235 H 265 C 305 235, 315 210, 315 202 C 315 190, 300 170, 265 170 H 200 Z" fill="#ffffff" />
    <!-- Diagonal Leg of "R" -->
    <path d="M 245 275 L 360 412 H 445 L 310 265 Z" fill="#ffffff" />

    <!-- Double Checkmark (Double Ticket OK Overlay) at Bottom Right -->
    <g transform="translate(240, 240)">
      <!-- Dark backdrop circle for contrast -->
      <circle cx="150" cy="150" r="105" fill="#0f172a" opacity="0.9" />
      <circle cx="150" cy="150" r="95" fill="url(#doubleCheckGrad)" />

      <!-- First Checkmark -->
      <path d="M 85 150 L 120 185 L 180 120" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Second Checkmark (Double Ticket OK) -->
      <path d="M 130 150 L 165 185 L 225 120" stroke="#cff4fc" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>
